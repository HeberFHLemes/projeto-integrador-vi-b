name: agendados
description: "Um aplicativo para a gestão de agendamentos para diferentes profissionais."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^17.5.0
  intl: ^0.20.3
  path: ^1.9.1
  sqflite: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter # fonte baixada do Google Fonts
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
          weight: 100 # por usar arquivo de fonte variável